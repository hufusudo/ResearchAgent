[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reacher-agent"
version = "0.1.0"
description = "Autonomous literature survey agent powered by LangGraph and Hybrid RAG."
readme = "docs/project_proposal.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "streamlit>=1.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
reacher = "core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["core", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
